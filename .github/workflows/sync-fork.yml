name: Sync Fork with Upstream

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Sync main branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure upstream remote
        run: git remote add upstream https://github.com/erkexzcx/justimport.git

      - name: Fetch upstream main
        run: git fetch upstream main

      - name: Fast-forward main from upstream
        run: |
          git checkout main
          git merge --ff-only upstream/main
          git push origin main
